<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friends Adda</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { height: 100%; overflow: hidden; background-color: #e5ddd5; touch-action: none; }
        
        .app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 600px; margin: 0 auto; background-color: #e5ddd5; position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Header */
        .header { background-color: #075E54; color: white; padding: 10px 15px; display: flex; align-items: center; gap: 12px; z-index: 10; }
        .avatar { width: 40px; height: 40px; background-color: #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar svg { width: 30px; height: 30px; fill: #fff; margin-top: 5px; }
        .header-info h1 { font-size: 18px; font-weight: 500; }
        .header-info p { font-size: 13px; color: #d1d1d1; }

        /* Chat Area */
        .chat-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
        .chat-area::-webkit-scrollbar { width: 0px; background: transparent; }

        /* Messages */
        .message { max-width: 75%; padding: 6px 10px 8px 10px; border-radius: 8px; font-size: 15px; position: relative; line-height: 1.4; word-wrap: break-word; }
        .msg-received { background-color: #ffffff; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg-sent { background-color: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        
        /* Username in Group Chat */
        .sender-name { font-size: 12px; font-weight: bold; color: #075E54; margin-bottom: 2px; display: block; }
        .msg-time { font-size: 11px; color: rgba(0,0,0,0.45); display: block; text-align: right; margin-top: 2px; }

        /* Footer */
        .footer { background-color: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; z-index: 10; }
        .input-box { flex: 1; background-color: #ffffff; border-radius: 25px; padding: 12px 15px; border: none; outline: none; font-size: 16px; }
        .send-btn { background-color: #008f68; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
        .send-btn:active { background-color: #007052; }
        .send-btn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }

        /* Username Modal (Popup) */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 50; display: flex; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 25px; border-radius: 12px; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-box h2 { color: #075E54; margin-bottom: 10px; font-size: 20px; }
        .modal-box p { font-size: 14px; color: #555; margin-bottom: 15px; }
        .modal-box input { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; text-align: center; margin-bottom: 15px; }
        .modal-box input:focus { border-color: #075E54; }
        .modal-box button { width: 100%; background: #075E54; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .modal-box button:active { background: #004d40; }
        .error-msg { color: red; font-size: 13px; margin-bottom: 10px; display: none; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Username Popup Modal -->
        <div id="usernameModal" class="modal-overlay hidden">
            <div class="modal-box">
                <h2>Welcome to Adda!</h2>
                <p>বন্ধুদের সাথে আড্ডা দিতে একটি ইউনিক নাম লিখুন।</p>
                <div id="errorMsg" class="error-msg">এই নামটি অন্য কেউ নিয়ে নিয়েছে!</div>
                <input type="text" id="usernameInput" placeholder="আপনার নাম লিখুন..." autocomplete="off">
                <button id="saveUserBtn">Join Chat</button>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="header-info">
                <h1>Friends Adda</h1>
                <p id="currentUserDisplay">Connecting...</p>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea"></div>

        <!-- Footer -->
        <div class="footer">
            <input type="text" id="messageInput" class="input-box" placeholder="Message" autocomplete="off" disabled>
            <button id="sendBtn" class="send-btn" disabled>
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, get, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // আপনার ফায়ারবেস কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyBtRqddwpKeq186gKrFAI6ZkunVShJnPWc",
            authDomain: "what-s-app-929e4.firebaseapp.com",
            databaseURL: "https://what-s-app-929e4-default-rtdb.firebaseio.com",
            projectId: "what-s-app-929e4",
            storageBucket: "what-s-app-929e4.firebasestorage.app",
            messagingSenderId: "965788385844",
            appId: "1:965788385844:web:af3607987d41d9b54d4061"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'whatsapp_test_chat');
        
        let myUsername = localStorage.getItem('chat_username');

        // Elements
        const modal = document.getElementById('usernameModal');
        const usernameInput = document.getElementById('usernameInput');
        const saveUserBtn = document.getElementById('saveUserBtn');
        const errorMsg = document.getElementById('errorMsg');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatArea = document.getElementById('chatArea');
        const currentUserDisplay = document.getElementById('currentUserDisplay');

        // প্রথমবার ভিজিট করলে পপআপ দেখানো
        if (!myUsername) {
            modal.classList.remove('hidden');
        } else {
            enableChat();
        }

        // ইউজারনেম সেভ করা
        saveUserBtn.addEventListener('click', async () => {
            let typedName = usernameInput.value.trim().toLowerCase();
            
            // নাম শুধু অক্ষর ও সংখ্যা দিয়ে হতে হবে (স্পেস বা স্পেশাল ক্যারেক্টার ছাড়া)
            let validNameRegex = /^[a-zA-Z0-9_]{3,15}$/;

            if(!validNameRegex.test(typedName)){
                errorMsg.innerText = "নাম ৩-১৫ অক্ষরের মধ্যে ইংরেজি অক্ষর বা সংখ্যা হতে হবে (কোনো স্পেস চলবে না)।";
                errorMsg.style.display = "block";
                return;
            }

            saveUserBtn.innerText = "Checking...";
            saveUserBtn.disabled = true;

            // ডাটাবেসে চেক করা যে নামটি আগে কেউ নিয়েছে কিনা
            const nameRef = ref(db, 'usernames/' + typedName);
            const snapshot = await get(nameRef);

            if (snapshot.exists()) {
                errorMsg.innerText = "এই নামটি অন্য কেউ নিয়ে নিয়েছে! অন্য নাম দিন।";
                errorMsg.style.display = "block";
                saveUserBtn.innerText = "Join Chat";
                saveUserBtn.disabled = false;
            } else {
                // নাম খালি থাকলে ডাটাবেসে সেভ করা এবং চ্যাট ওপেন করা
                await set(nameRef, true);
                localStorage.setItem('chat_username', typedName);
                myUsername = typedName;
                modal.classList.add('hidden');
                enableChat();
            }
        });

        // চ্যাট চালু করার ফাংশন
        function enableChat() {
            currentUserDisplay.innerText = "Logged in as: " + myUsername;
            messageInput.disabled = false;
            sendBtn.disabled = false;
            loadMessages();
        }

        // মেসেজ পাঠানো
        function sendMessage() {
            const text = messageInput.value.trim();
            if(text !== "") {
                push(chatRef, {
                    username: myUsername,
                    text: text,
                    timestamp: new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: 'numeric', hour12: true })
                });
                messageInput.value = '';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // মেসেজ লোড করা
        function loadMessages() {
            onChildAdded(chatRef, (snapshot) => {
                const data = snapshot.val();
                const msgDiv = document.createElement('div');
                
                // নিজের মেসেজ ডানে, অন্যের মেসেজ বামে
                if(data.username === myUsername) {
                    msgDiv.className = 'message msg-sent';
                    msgDiv.innerHTML = `
                        ${data.text}
                        <span class="msg-time">${data.timestamp}</span>
                    `;
                } else {
                    msgDiv.className = 'message msg-received';
                    msgDiv.innerHTML = `
                        <span class="sender-name">${data.username}</span>
                        ${data.text}
                        <span class="msg-time">${data.timestamp}</span>
                    `;
                }
                
                chatArea.appendChild(msgDiv);
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        }

        // মোবাইলের কিবোর্ড ইস্যু ফিক্স
        window.visualViewport.addEventListener("resize", () => {
            document.body.style.height = window.visualViewport.height + "px";
            chatArea.scrollTop = chatArea.scrollHeight;
        });
    </script>
</body>
</html>
